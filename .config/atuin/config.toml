enter_accept = true
search_mode = "daemon-fuzzy"

# --- UI: keep the search view minimal ---
style = "compact"
inline_height = 20
show_help = false      # removes the top keyboard-shortcut help line
show_tabs = false      # removes the "Search | Inspect" tabs
show_preview = false
# NOTE: the interactive TUI's per-row time/duration columns and the [ GLOBAL ]
# filter footer are not individually configurable in atuin 18.x. history_format
# below only affects non-interactive `atuin history list` / search output.
history_format = "{command}"

[daemon]
enabled = true
autostart = true
